# =====================================================================
# VRSTVA: AI Engine, Izolace, Hermes a Kontejnery na HP G4 Serveru
# =====================================================================

- hosts: hp_g4_server_1
  become: true
  roles:
    - sys_kernel_ai_tuning       # Hugepages a doladění paměti pro AI
    - role_user_llama            # Nativní llama-server + Core Pinning + rbash
    - role_llama_deploy          # Stažení Qwen modelu a ostrá konfigurace služby
    - role_user_hermes           # Python agent + venv + API brána
    - role_user_podman           # Rootless kontejnery pro klienty a weby
    - gitops_enforcer            # Kontrola deklarovaného stavu (třešnička)
    
  tasks:
    - name: Ověření, že Llama API žije
      uri:
        url: "http://127.0.0.1:8080/health"
        method: GET
      register: ai_health
      ignore_errors: yes

    - name: Výsledek ověření AI vrstvy
      debug:
        msg: "AI Server stav: {{ ai_health.status | default('Nedostupný') }}"
